name: CI e CD - AWS Lightsail

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lacrei_ci
          POSTGRES_USER: lacrei_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lacrei_ci -d lacrei_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-insecure-test-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: postgresql://lacrei_ci:ci_only_password@127.0.0.1:5432/lacrei_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Poetry
        run: python -m pip install "poetry>=2.0,<3.0"
      - name: Instalar dependencias
        run: poetry install --no-root --no-interaction
      - name: Lint
        run: poetry run ruff check .
      - name: Checar migrations
        run: poetry run python manage.py makemigrations --check --dry-run
      - name: Testes automatizados
        run: poetry run python manage.py test
      - name: Verificar configuracoes Django
        run: poetry run python manage.py check

  build:
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -t lacrei-backend:${{ github.sha }} .

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - name: Configurar chave SSH e host verificado
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Publicar develop no Lightsail e verificar saude
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 "ubuntu@${SSH_HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/lacrei-saude-desafio
          test -f .env.aws && test -f compose.aws.yml
          git diff --quiet && git diff --cached --quiet
          git fetch origin develop
          if git show-ref --verify --quiet refs/heads/develop; then
            git switch develop
            git pull --ff-only origin develop
          else
            git switch -c develop --track origin/develop
          fi
          sudo -n docker compose --env-file .env.aws -f compose.aws.yml up -d --build
          sudo -n docker compose --env-file .env.aws -f compose.aws.yml ps
          curl --fail --silent --show-error --retry-all-errors --retry 24 --retry-delay 5 --max-time 8 -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/
          REMOTE

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Configurar chave SSH e host verificado
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Publicar main no Lightsail e verificar saude
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 "ubuntu@${SSH_HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/lacrei-saude-desafio
          test -f .env.aws && test -f compose.aws.yml
          git diff --quiet && git diff --cached --quiet
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          sudo -n docker compose --env-file .env.aws -f compose.aws.yml up -d --build
          sudo -n docker compose --env-file .env.aws -f compose.aws.yml ps
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 8 -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/ | grep -q '"status":"ok"'
          REMOTE
