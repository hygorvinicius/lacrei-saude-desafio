name: CI e CD - AWS Lightsail

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lacrei_ci
          POSTGRES_USER: lacrei_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lacrei_ci -d lacrei_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-insecure-test-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: postgresql://lacrei_ci:ci_only_password@127.0.0.1:5432/lacrei_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Poetry
        run: python -m pip install "poetry>=2.0,<3.0"
      - name: Instalar dependencias
        run: poetry install --no-root --no-interaction
      - name: Lint
        run: poetry run ruff check .
      - name: Checar migrations
        run: poetry run python manage.py makemigrations --check --dry-run
      - name: Testes automatizados
        run: poetry run python manage.py test
      - name: Verificar configuracoes Django
        run: poetry run python manage.py check

  build:
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -t lacrei-backend:${{ github.sha }} .

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - name: Configurar chave SSH e host verificado
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Publicar develop no Lightsail e verificar saude
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 "ubuntu@${SSH_HOST}" "bash -se -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          EXPECTED_SHA="$1"
          cd /home/ubuntu/lacrei-saude-desafio
          test -f .env.aws && test -f compose.aws.yml
          git diff --quiet && git diff --cached --quiet
          # Nao publicar o HEAD mutavel da branch: usar o SHA que passou no CI.
          git fetch --no-tags origin develop
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA" || {
            echo "A branch mudou desde o inicio do pipeline. Deploy abortado."; exit 1;
          }
          git cat-file -e "${EXPECTED_SHA}^{commit}"
          git switch --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet && git diff --cached --quiet
          echo "DEPLOYED_SHA=$EXPECTED_SHA"
          sudo -n docker compose --env-file .env.aws -f compose.aws.yml up -d --build
          sudo -n docker compose --env-file .env.aws -f compose.aws.yml ps
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors \
            --max-time 8 -H 'X-Forwarded-Proto: https' -H 'Accept: application/json' \
            http://127.0.0.1:8000/health/ | \
            python3 -c 'import sys,json; assert json.load(sys.stdin) == {"status":"ok"}'
          REMOTE
      - name: Verificar HTTPS publico e registrar evidencias
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            --max-time 10 -H 'Accept: application/json' 'https://18-227-202-242.sslip.io/health/' | \
            python3 -c 'import sys,json; assert json.load(sys.stdin) == {"status":"ok"}'
          {
            echo '### Deploy staging: aprovado'
            echo "- Commit publicado: \`$GITHUB_SHA\`"
            echo "- Execucao: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '- Health publica: https://18-227-202-242.sslip.io/health/'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Configurar chave SSH e host verificado
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Publicar main no Lightsail e verificar saude
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 "ubuntu@${SSH_HOST}" "bash -se -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          EXPECTED_SHA="$1"
          cd /home/ubuntu/lacrei-saude-desafio
          test -f .env.aws && test -f compose.aws.yml
          git diff --quiet && git diff --cached --quiet
          # Nao publicar o HEAD mutavel da branch: usar o SHA que passou no CI.
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA" || {
            echo "A branch mudou desde o inicio do pipeline. Deploy abortado."; exit 1;
          }
          git cat-file -e "${EXPECTED_SHA}^{commit}"
          git switch --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet && git diff --cached --quiet
          echo "DEPLOYED_SHA=$EXPECTED_SHA"
          sudo -n docker compose --env-file .env.aws -f compose.aws.yml up -d --build
          sudo -n docker compose --env-file .env.aws -f compose.aws.yml ps
          curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors \
            --max-time 8 -H 'X-Forwarded-Proto: https' -H 'Accept: application/json' \
            http://127.0.0.1:8000/health/ | \
            python3 -c 'import sys,json; assert json.load(sys.stdin) == {"status":"ok"}'
          REMOTE
      - name: Verificar HTTPS publico e registrar evidencias
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            --max-time 10 -H 'Accept: application/json' 'https://3-133-248-90.sslip.io/health/' | \
            python3 -c 'import sys,json; assert json.load(sys.stdin) == {"status":"ok"}'
          {
            echo '### Deploy production: aprovado'
            echo "- Commit publicado: \`$GITHUB_SHA\`"
            echo "- Execucao: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '- Health publica: https://3-133-248-90.sslip.io/health/'
          } >> "$GITHUB_STEP_SUMMARY"
