[tool.poetry]
name = "lacrei-backend"
version = "0.1.0"
description = "API REST de profissionais e consultas para o desafio Lacrei Saúde"
authors = ["Candidato Lacrei Saúde"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
Django = ">=5.2,<6.0"
djangorestframework = ">=3.16,<4.0"
django-cors-headers = ">=4.7,<5.0"
dj-database-url = ">=2.3,<4.0"
psycopg = {version = ">=3.2,<4.0", extras = ["binary"]}
gunicorn = ">=23.0,<26.0"
whitenoise = ">=6.9,<7.0"
drf-spectacular = ">=0.28,<1.0"
python-dotenv = ">=1.0,<2.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.11,<1.0"

[tool.ruff]
line-length = 100
exclude = [".git", ".venv", "**/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
