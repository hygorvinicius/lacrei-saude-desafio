name: CI e CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lacrei_ci
          POSTGRES_USER: lacrei_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lacrei_ci -d lacrei_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-insecure-test-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: postgresql://lacrei_ci:ci_only_password@127.0.0.1:5432/lacrei_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Poetry
        run: python -m pip install "poetry>=2.0,<3.0"
      - name: Instalar dependências
        run: poetry install --no-root --no-interaction
      - name: Lint
        run: poetry run ruff check .
      - name: Checar migrations
        run: poetry run python manage.py makemigrations --check --dry-run
      - name: Testes automatizados
        run: poetry run python manage.py test
      - name: Verificar configurações Django
        run: poetry run python manage.py check

  build:
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -t lacrei-backend:${{ github.sha }} .

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Publicar staging via Render Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo 'Cadastre RENDER_DEPLOY_HOOK no ambiente staging'; exit 1; }
          curl --fail --show-error --silent --retry 3 -X POST "$DEPLOY_HOOK"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Publicar produção via Render Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo 'Cadastre RENDER_DEPLOY_HOOK no ambiente production'; exit 1; }
          curl --fail --show-error --silent --retry 3 -X POST "$DEPLOY_HOOK"
